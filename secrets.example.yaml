# Copy to secrets.yaml and replace every placeholder. Do not commit secrets.yaml.
wifi_ssid: "YOUR_WIFI_SSID"
wifi_password: "YOUR_WIFI_PASSWORD"
fallback_password: "YOUR_FALLBACK_AP_PASSWORD"
# Generate a key with: openssl rand -base64 32
api_encryption_key: "BASE64_32_BYTE_KEY"
ota_password: "YOUR_OTA_PASSWORD"
ecowitt_ip: "YOUR_HOME_ASSISTANT_HOST"
ecowitt_path: "/api/webhook/YOUR_WEBHOOK_ID"
timezone: "UTC"
# Set your own location for sunrise and sunset on the display.
latitude: 0.0
longitude: 0.0
